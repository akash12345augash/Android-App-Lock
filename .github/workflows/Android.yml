
name: Build App Lock APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | head -n 1)
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")/../platform-tools" >> "$GITHUB_PATH"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install SDK packages
        run: |
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: |
          mkdir -p project
          unzip -o Android-App-Lock-Complete-Project.zip -d project
          test -f project/settings.gradle.kts
          test -f project/app/build.gradle.kts

      - name: Fix accessibility XML
        run: |
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET

          base = pathlib.Path("project")
          configs = list(base.rglob("accessibility_service_config.xml"))
          if configs:
              config = configs[0]
              android = "{http://schemas.android.com/apk/res/android}"
              tree = ET.parse(config)
              tree.getroot().set(
                  android + "description",
                  "@string/accessibility_service_description"
              )
              tree.write(config, encoding="utf-8",
                         xml_declaration=True)

              values = config.parents[1] / "values"
              values.mkdir(parents=True, exist_ok=True)
              strings = values / "strings.xml"

              if strings.exists():
                  st = ET.parse(strings)
                  root = st.getroot()
              else:
                  root = ET.Element("resources")
                  st = ET.ElementTree(root)

              item = root.find(
                  "string[@name='accessibility_service_description']"
              )
              if item is None:
                  item = ET.SubElement(
                      root, "string",
                      {"name": "accessibility_service_description"}
                  )
              item.text = (
                  "Detects when a selected app is opened so App Lock "
                  "can show its lock screen."
              )
              st.write(strings, encoding="utf-8",
                       xml_declaration=True)
          PY

      - name: Build APK
        run: gradle -p project assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
