
name: Build App Lock APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          mkdir -p project
          unzip -o Android-App-Lock-Complete-Project.zip -d project

      - name: Fix XML automatically
        run: |
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET

          roots = [pathlib.Path("project")]
          configs = list(roots[0].rglob("accessibility_service_config.xml"))
          if not configs:
              raise SystemExit("Accessibility XML file not found")

          config = configs[0]
          android = "{http://schemas.android.com/apk/res/android}"
          tree = ET.parse(config)
          root = tree.getroot()
          root.set(android + "description",
                   "@string/accessibility_service_description")
          tree.write(config, encoding="utf-8", xml_declaration=True)

          values = config.parents[1] / "values"
          values.mkdir(parents=True, exist_ok=True)
          strings = values / "strings.xml"

          if strings.exists():
              st = ET.parse(strings)
              sr = st.getroot()
          else:
              sr = ET.Element("resources")
              st = ET.ElementTree(sr)

          item = sr.find("string[@name='accessibility_service_description']")
          if item is None:
              item = ET.SubElement(
                  sr, "string",
                  {"name": "accessibility_service_description"}
              )
          item.text = (
              "Detects when a selected app is opened so App Lock "
              "can show its lock screen."
          )
          st.write(strings, encoding="utf-8", xml_declaration=True)
          print("Accessibility description fixed")
          PY

      - name: Build APK
        run: gradle -p project assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
